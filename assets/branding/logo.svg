<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0F0C20" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#181434"/>
      <stop offset="100%" stop-color="#0F0D24"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="glowEffect" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7C3AED" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="230" fill="url(#bgGlow)"/>

  <!-- Base App Icon Card -->
  <rect x="56" y="56" width="400" height="400" rx="90" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="4" filter="url(#shadow)"/>

  <!-- PDF Document Shape -->
  <path d="M160 140 H 290 L 352 202 V 372 C 352 383 343 392 332 392 H 160 C 149 392 140 383 140 372 V 160 C 140 149 149 140 160 140 Z" 
        fill="#1E1B4B" stroke="url(#borderGrad)" stroke-width="3.5" stroke-linejoin="round"/>
  
  <!-- PDF Corner Fold -->
  <path d="M 290 140 V 192 C 290 197 294 202 300 202 H 352 Z" 
        fill="#2E2868" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Document Lines (Abstract Text) -->
  <rect x="175" y="235" width="80" height="7" rx="3.5" fill="#4338CA" opacity="0.8"/>
  <rect x="175" y="255" width="105" height="7" rx="3.5" fill="#4338CA" opacity="0.6"/>
  <rect x="175" y="275" width="95" height="7" rx="3.5" fill="#4338CA" opacity="0.6"/>

  <!-- Neural Brain / Spark / Search Symbol -->
  <g transform="translate(40, 20)">
    <!-- Circuit Connections -->
    <path d="M 230 290 L 260 260 L 305 275" stroke="#06B6D4" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
    <path d="M 260 260 L 285 220" stroke="#A855F7" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Spark / AI Star Center -->
    <path d="M 285 240 Q 285 200 310 200 Q 285 200 285 160 Q 285 200 260 200 Q 285 200 285 240 Z" 
          fill="url(#accentGrad)" filter="url(#shadow)"/>

    <!-- Synapse Nodes -->
    <circle cx="230" cy="290" r="6" fill="#38BDF8"/>
    <circle cx="305" cy="275" r="5" fill="#A855F7"/>
    <circle cx="260" cy="260" r="7" fill="#818CF8"/>
  </g>

  <!-- PDF Badge Pill -->
  <rect x="165" y="325" width="70" height="30" rx="8" fill="url(#borderGrad)"/>
  <text x="200" y="346" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">PDF</text>

  <!-- RAG Badge Pill -->
  <rect x="245" y="325" width="80" height="30" rx="8" fill="#10B981"/>
  <text x="285" y="346" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">RAG</text>
</svg>
